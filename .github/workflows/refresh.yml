name: Refresh scores and rebuild site

on:
  schedule:
    # Cron here is UTC. Charlotte is UTC-4 (EDT) until Nov 1, then UTC-5.
    - cron: "0 11 * * *"         # every day 7 AM Eastern: also refresh team points/finishes
    - cron: "0 17,23 * * *"      # every day 1 PM, 7 PM Eastern
    - cron: "0 4-23 * * 4"       # Thursday, hourly (from midnight Eastern)
    - cron: "0 * * * 5,6,0"      # Friday, Saturday, Sunday, hourly
    - cron: "0 0-3 * * 1"        # Sunday 8-11 PM Eastern (Monday early UTC)
    - cron: "30 12 * * 1,4"      # Mon + Thu 8:30 AM Eastern: also discover upcoming area events
  workflow_dispatch:             # "Run workflow" button in the Actions tab
    inputs:
      discover:
        description: "Also sweep the tournament list for recent area events"
        type: boolean
        default: false
      teams:
        description: "Also refresh every team's statistics page (points, finishes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Playwright
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch pages and rebuild docs/
        env:
          SCHED: ${{ github.event.schedule }}
          DISCOVER: ${{ inputs.discover }}
          TEAMS: ${{ inputs.teams }}
        run: |
          FLAGS=""
          case "$SCHED" in
            "30 12 * * 1,4") FLAGS="--discover --teams" ;;
            "0 11 * * *")    FLAGS="--teams" ;;
          esac
          if [ "$DISCOVER" = "true" ]; then FLAGS="$FLAGS --discover"; fi
          if [ "$TEAMS" = "true" ]; then FLAGS="$FLAGS --teams"; fi
          echo "refresh.py $FLAGS"
          python refresh.py $FLAGS

      - name: Commit if anything changed
        run: |
          git config user.name "score-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs elite9_schedule.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Refresh scores $(date '+%a %b %d %I:%M %p %Z')"
            git push
          fi
